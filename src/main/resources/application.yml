spring:
  profiles:
    group:
      default: common, default
      dev: common, dev
      prd: common, prd
    active: default
---
spring:
  config:
    activate:
      on-profile: common

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8887

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.board_was.model

logging:
  config: classpath:logback-spring.xml

file:
  upload-dir: C:/data001/attachFiles
---
spring:
  config:
    activate:
      on-profile: default
    import:
      - classpath:config/default/config.yml
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - classpath:config/dev/config.yml
---
spring:
  config:
    activate:
      on-profile: prd
    import:
      - classpath:config/prd/config.yml